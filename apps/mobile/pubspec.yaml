name: food_delivery
description: Food delivery mobile foundation for Android and iOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter_secure_storage: 11.2.0
  geolocator: 14.1.2
  image_picker: 1.2.4
  flutter:
    sdk: flutter
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/food/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo.png
  remove_alpha_ios: true
