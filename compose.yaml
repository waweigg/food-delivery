services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: food_development
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_development"]
      interval: 5s
      retries: 10
volumes:
  database:
