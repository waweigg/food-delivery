apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector: {app: identity}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate-day2
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: identity-migrate}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: food-delivery-identity:dev
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'npm run migrate && node dist/init-database.js']
          envFrom:
            - configMapRef: {name: identity-config}
            - secretRef: {name: identity-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 1
  selector:
    matchLabels: {app: identity}
  template:
    metadata:
      labels: {app: identity}
    spec:
      containers:
        - name: identity
          image: food-delivery-identity:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          envFrom:
            - configMapRef: {name: identity-config}
            - secretRef: {name: identity-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/ready, port: 3000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 3000}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: identity-worker}
  template:
    metadata:
      labels: {app: identity-worker}
    spec:
      containers:
        - name: worker
          image: food-delivery-identity:dev
          imagePullPolicy: IfNotPresent
          command: [npm, run, worker]
          envFrom:
            - configMapRef: {name: identity-config}
            - secretRef: {name: identity-secrets}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
