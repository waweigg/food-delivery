# Development-only single-node S3-compatible storage. No public Service/Ingress.
apiVersion: v1
kind: Service
metadata:
  name: object-storage
spec:
  selector: {app: object-storage}
  ports: [{port: 8333, targetPort: 8333}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-storage
spec:
  serviceName: object-storage
  replicas: 1
  selector:
    matchLabels: {app: object-storage}
  template:
    metadata:
      labels: {app: object-storage}
    spec:
      containers:
        - name: storage
          image: chrislusf/seaweedfs:latest
          args: [mini, '-dir=/data', '-ip=127.0.0.1', '-ip.bind=0.0.0.0']
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: restaurants-secrets, key: MENU_S3_ACCESS_KEY}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: restaurants-secrets, key: MENU_S3_SECRET_KEY}
            - {name: S3_BUCKET, value: menu-photos}
          ports: [{containerPort: 8333}]
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          volumeMounts:
            - {name: photos, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: photos
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: menu-storage-private
spec:
  podSelector:
    matchLabels: {app: object-storage}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: restaurants}
      ports: [{protocol: TCP, port: 8333}]
