worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 32k;
    location = /gateway-health { return 200 'ok'; }
    location = /admin-ui { return 302 /admin-ui/; }
    location ^~ /admin-ui/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
      add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /internal/ { return 404; }
    location ~ ^/restaurant-onboarding/[^/]+/menu/photos/?$ {
      client_max_body_size 5m;
      proxy_pass http://restaurants:3001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
    location ~ ^/(catalog/restaurants|catalog/coverage|restaurant-onboarding|admin/restaurants|restaurants-health)(/|$) {
      proxy_pass http://restaurants:3001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
    location ~ ^/(driver|driver-admin|drivers-health)(/|$) {
      proxy_pass http://drivers:3004;
    }
    location ~ ^/payments(/|$) {
      proxy_pass http://payments:3003;
    }
    location ~ ^/orders(/|$) {
      proxy_pass http://orders:3002;
    }
    location / {
      proxy_pass http://identity:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}



