apiVersion: v1
kind: Service
metadata:
  name: drivers-db
spec:
  selector: {app: drivers-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: drivers-db
spec:
  serviceName: drivers-db
  replicas: 1
  selector:
    matchLabels: {app: drivers-db}
  template:
    metadata:
      labels: {app: drivers-db}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_USER, value: drivers}
            - {name: POSTGRES_DB, value: drivers_development}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: drivers-secrets, key: POSTGRES_PASSWORD}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec:
              command: [pg_isready, -U, drivers, -d, drivers_development]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: database, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: drivers
spec:
  selector: {app: drivers}
  ports: [{port: 3004, targetPort: 3004}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: drivers}
spec:
  replicas: 1
  selector: {matchLabels: {app: drivers}}
  template:
    metadata: {labels: {app: drivers}}
    spec:
      containers:
        - name: drivers
          image: food-delivery-drivers:dev
          envFrom:
            - configMapRef: {name: drivers-config}
            - secretRef: {name: drivers-secrets}
          readinessProbe: {httpGet: {path: /drivers-health, port: 3004}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: drivers-ingress}
spec:
  podSelector: {matchLabels: {app: drivers}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: gateway}}}]
      ports: [{port: 3004}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: drivers-db-ingress}
spec:
  podSelector: {matchLabels: {app: drivers-db}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: drivers}}}]
      ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: drivers-to-identity}
spec:
  podSelector: {matchLabels: {app: identity}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: drivers}}}]
      ports: [{port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dispatch-worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: dispatch-worker}}
  template:
    metadata: {labels: {app: dispatch-worker}}
    spec:
      containers:
        - name: worker
          image: food-delivery-drivers:dev
          args: ["node", "service.mjs", "--worker"]
          envFrom:
            - configMapRef: {name: drivers-config}
            - secretRef: {name: drivers-secrets}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dispatch-to-db}
spec:
  podSelector: {matchLabels: {app: drivers-db}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: dispatch-worker}}}]
      ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dispatch-to-orders}
spec:
  podSelector: {matchLabels: {app: orders}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: dispatch-worker}}}]
      ports: [{port: 3002}]
    - from: [{podSelector: {matchLabels: {app: drivers}}}]
      ports: [{port: 3002}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dispatch-to-restaurants}
spec:
  podSelector: {matchLabels: {app: restaurants}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: dispatch-worker}}}]
      ports: [{port: 3001}]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-to-drivers-tracking
spec:
  podSelector: {matchLabels: {app: drivers}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: orders}}}]
      ports: [{port: 3004}]
