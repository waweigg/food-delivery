apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector: {app: identity-database}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels: {app: identity-database}
  template:
    metadata:
      labels: {app: identity-database}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_USER, value: food}
            - {name: POSTGRES_DB, value: food_development}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: identity-secrets, key: POSTGRES_PASSWORD}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec:
              command: [pg_isready, -U, food, -d, food_development]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: database, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
